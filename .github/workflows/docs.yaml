name: Docs

# Builds the Starlight site in docs/ and publishes it to GitHub Pages at
# https://<owner>.github.io/<repo>/. Site URL and base path come from the
# Pages configuration, so forks publish under their own name.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name + " " + .html_url' 2>/dev/null); then
            echo "version=${out%% *}" >> "$GITHUB_OUTPUT"
            echo "url=${out#* }" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SITE: ${{ steps.pages.outputs.origin || 'https://example.github.io' }}
          BASE: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
