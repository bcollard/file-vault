name: Terraform plan

# Plans the deploy environment on pull requests that touch Terraform and posts
# the plan as a comment. Uses the same variables and TFVARS secret as deploy.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yaml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'prod' }}
  REGION: ${{ vars.GCP_REGION || 'europe-west9' }}
  WIF_PROVIDER: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WIF_POOL || 'gitops-pool' }}/providers/${{ vars.WIF_PROVIDER || 'gh-provider' }}

jobs:
  plan:
    # Fork PRs get no OIDC token or secrets; skip rather than fail.
    if: vars.GCP_PROJECT_ID != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV || 'prod' }}
    env:
      TF_WORKDIR: terraform/envs/${{ vars.DEPLOY_ENV || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: gha-tf-file-vault@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.17
          terraform_wrapper: false

      - name: Write terraform.tfvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > "$TF_WORKDIR/terraform.tfvars"

      - run: terraform -chdir="$TF_WORKDIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        id: plan
        run: |
          # Plan against the image that is running now, so the diff shows only
          # infrastructure changes.
          image="$(gcloud run services describe "file-vault-${DEPLOY_ENV}" --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" --format='value(spec.template.spec.containers[0].image)' 2>/dev/null \
            || echo gcr.io/cloudrun/hello)"
          set +e
          terraform -chdir="$TF_WORKDIR" plan -no-color -input=false -var "image=${image}" -out=tfplan
          rc=$?
          terraform -chdir="$TF_WORKDIR" show -no-color tfplan > "$RUNNER_TEMP/plan.txt"
          exit $rc

      - name: Post plan to PR
        if: always() && github.event.pull_request
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan failed before output)';
            const max = 60000;
            const truncated = plan.length > max
              ? plan.slice(0, max) + '\n\n…(truncated — see job log for full plan)'
              : plan;
            const body = [
              `### Terraform plan — \`${process.env.TF_WORKDIR}\``,
              '',
              '<details><summary>Click to expand</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '</details>',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
