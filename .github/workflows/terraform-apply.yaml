name: Terraform apply (dev)

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  WIF_PROVIDER: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WIF_POOL || 'gitops-pool' }}/providers/${{ vars.WIF_PROVIDER || 'gh-provider' }}
  WIF_SA: gha-tf-file-vault@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  TF_WORKDIR: ./terraform/envs/dev

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=${{ env.TF_WORKDIR }} init

      - name: terraform apply
        run: terraform -chdir=${{ env.TF_WORKDIR }} apply -auto-approve -input=false

      - name: Summary
        if: always()
        run: |
          {
            echo "## Terraform apply (dev)"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo "**Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
