name: Terraform apply (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (commit SHA) — applied to api, frontend, and sweeper'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west9' }}
  AR_REPO: ${{ vars.AR_REPO || 'file-vault' }}
  WIF_PROVIDER: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WIF_POOL || 'gitops-pool' }}/providers/${{ vars.WIF_PROVIDER || 'gh-provider' }}
  WIF_SA: gha-tf-file-vault@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  TF_WORKDIR: ./terraform/envs/prod

concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Requires a GitHub "prod" environment configured with reviewers /
    # protection rules. Without it the job runs immediately on dispatch.
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Auth via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ~1.9
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=${{ env.TF_WORKDIR }} init

      - name: terraform apply with image tags
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
          terraform -chdir=${{ env.TF_WORKDIR }} apply -auto-approve -input=false \
            -var "api_image=${IMAGE_BASE}/api:${{ inputs.image_tag }}" \
            -var "web_image=${IMAGE_BASE}/web:${{ inputs.image_tag }}" \
            -var "sweeper_image=${IMAGE_BASE}/api:${{ inputs.image_tag }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Terraform apply (prod)"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo "**Image tag:** \`${{ inputs.image_tag }}\`"
            echo "**Triggered by:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
