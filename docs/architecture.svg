<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#137333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">file-vault — Architecture</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#5f6368">Capability-URL file sharing on GCP. One-time download tokens, long-lived admin tokens.</text>

  <!-- Users -->
  <g>
    <rect x="60" y="90" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="140" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Uploader</text>
    <text x="140" y="135" text-anchor="middle" font-size="11" fill="#5f6368">browser</text>

    <rect x="780" y="90" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="860" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Recipient</text>
    <text x="860" y="135" text-anchor="middle" font-size="11" fill="#5f6368">browser</text>
  </g>

  <!-- LB layer -->
  <g>
    <rect x="200" y="190" width="600" height="70" rx="8" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="500" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">External HTTPS Load Balancer + Cloud CDN (you manage)</text>
    <text x="500" y="235" text-anchor="middle" font-size="11" fill="#5f6368">host: file-vault.example.com</text>
    <text x="500" y="250" text-anchor="middle" font-size="11" fill="#5f6368">path matcher:  / → frontend NEG    /d/* → API NEG</text>
  </g>

  <!-- Arrow: uploader → LB -->
  <path d="M 140 150 L 140 195 L 350 195" fill="none" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="160" y="175" font-size="10" fill="#1a73e8">upload / admin</text>

  <!-- Arrow: recipient → LB -->
  <path d="M 860 150 L 860 195 L 650 195" fill="none" stroke="#137333" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="780" y="175" font-size="10" fill="#137333">GET /d/{token}</text>

  <!-- Cloud Run services -->
  <g>
    <rect x="140" y="310" width="220" height="100" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="250" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Frontend</text>
    <text x="250" y="352" text-anchor="middle" font-size="11" fill="#5f6368">Cloud Run v2</text>
    <text x="250" y="368" text-anchor="middle" font-size="10" font-family="monospace" fill="#5f6368">Go + Templ + htmx</text>
    <text x="250" y="385" text-anchor="middle" font-size="10" fill="#5f6368">ingress: internal + LB</text>
    <text x="250" y="400" text-anchor="middle" font-size="10" fill="#5f6368">VPC egress: all-traffic</text>

    <rect x="640" y="310" width="220" height="100" rx="8" fill="#fff" stroke="#137333" stroke-width="1.5"/>
    <text x="750" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">API</text>
    <text x="750" y="352" text-anchor="middle" font-size="11" fill="#5f6368">Cloud Run v2</text>
    <text x="750" y="368" text-anchor="middle" font-size="10" font-family="monospace" fill="#5f6368">Go (stdlib http)</text>
    <text x="750" y="385" text-anchor="middle" font-size="10" fill="#5f6368">ingress: internal + LB</text>
    <text x="750" y="400" text-anchor="middle" font-size="10" fill="#5f6368">SA: signs V4 URLs (SignBlob)</text>
  </g>

  <!-- Arrows from LB -->
  <path d="M 350 260 L 250 305" fill="none" stroke="#1a73e8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="265" y="285" font-size="10" fill="#1a73e8">NEG</text>

  <path d="M 650 260 L 750 305" fill="none" stroke="#137333" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="710" y="285" font-size="10" fill="#137333">NEG</text>

  <!-- Frontend → API (internal mesh) -->
  <path d="M 360 360 L 640 360" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="500" y="352" text-anchor="middle" font-size="10" fill="#5f6368">VPC egress → api.run.app</text>
  <text x="500" y="378" text-anchor="middle" font-size="10" fill="#5f6368">Authorization: Bearer &lt;ID token&gt;</text>

  <!-- Data plane -->
  <g>
    <rect x="60" y="470" width="180" height="80" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
    <text x="150" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Firestore</text>
    <text x="150" y="513" text-anchor="middle" font-size="10" fill="#5f6368">shares / admin_tokens /</text>
    <text x="150" y="528" text-anchor="middle" font-size="10" fill="#5f6368">download_tokens / audit_events</text>
    <text x="150" y="543" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">TTL on expires_at</text>

    <rect x="270" y="470" width="180" height="80" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
    <text x="360" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">GCS bucket</text>
    <text x="360" y="513" text-anchor="middle" font-size="10" fill="#5f6368">UBLA, public access blocked</text>
    <text x="360" y="528" text-anchor="middle" font-size="10" fill="#5f6368">no versioning, lifecycle 7d</text>
    <text x="360" y="543" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">CMEK via KMS</text>

    <rect x="480" y="470" width="160" height="80" rx="8" fill="#fff7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="560" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Secret Manager</text>
    <text x="560" y="515" text-anchor="middle" font-size="10" fill="#5f6368">HMAC pepper</text>
    <text x="560" y="530" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">(used to hash tokens at rest)</text>

    <rect x="670" y="470" width="160" height="80" rx="8" fill="#fff7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="750" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Cloud KMS</text>
    <text x="750" y="515" text-anchor="middle" font-size="10" fill="#5f6368">CMEK for the bucket</text>
    <text x="750" y="530" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">90-day rotation</text>
  </g>

  <!-- Sweeper -->
  <g>
    <rect x="860" y="470" width="120" height="80" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="1.5"/>
    <text x="920" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Sweeper</text>
    <text x="920" y="513" text-anchor="middle" font-size="10" fill="#5f6368">Cloud Run Job</text>
    <text x="920" y="528" text-anchor="middle" font-size="10" fill="#5f6368">+ Scheduler</text>
    <text x="920" y="543" text-anchor="middle" font-size="9" font-style="italic" fill="#5f6368">deletes stale objects</text>
  </g>

  <!-- API to data plane arrows -->
  <path d="M 700 415 L 220 470" fill="none" stroke="#137333" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="380" y="445" font-size="10" fill="#137333">RunTransaction (burn)</text>

  <path d="M 720 415 L 380 470" fill="none" stroke="#137333" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="560" y="438" font-size="10" fill="#137333">SignedURL / write</text>

  <path d="M 750 415 L 560 470" fill="none" stroke="#137333" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- GCS encrypts using KMS (sideband) -->
  <path d="M 450 510 L 670 510" fill="none" stroke="#f9ab00" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="560" y="505" text-anchor="middle" font-size="9" fill="#f9ab00">encrypts with</text>

  <!-- Sweeper → GCS / Firestore -->
  <path d="M 860 510 L 450 510" fill="none" stroke="#137333" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Recipient receives signed URL → GCS (via 302) -->
  <path d="M 860 410 L 860 470 L 440 470" fill="none" stroke="#137333" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6 3"/>
  <text x="785" y="440" font-size="10" fill="#137333">302 → signed URL (60s)</text>

  <!-- Legend -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="880" height="80" rx="6" fill="#f8f9fa" stroke="#dadce0"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#202124">Trust boundaries</text>
    <circle cx="20" cy="40" r="5" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="32" y="44" font-size="11" fill="#202124">user-facing (HTML / multipart)</text>
    <circle cx="220" cy="40" r="5" fill="#fff" stroke="#137333"/>
    <text x="232" y="44" font-size="11" fill="#202124">backend, capability-token authz</text>
    <circle cx="430" cy="40" r="5" fill="#fce8e6" stroke="#c5221f"/>
    <text x="442" y="44" font-size="11" fill="#202124">data plane (private)</text>
    <circle cx="600" cy="40" r="5" fill="#fff7e0" stroke="#f9ab00"/>
    <text x="612" y="44" font-size="11" fill="#202124">secret / key material</text>

    <text x="14" y="65" font-size="11" font-style="italic" fill="#5f6368">Dashed arrows are async or sideband. Solid arrows are request-time.</text>
  </g>
</svg>
