<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- browser -->
  <rect x="24" y="40" width="250" height="390" rx="14" fill="#eef2ff" stroke="#6366f1"/>
  <text x="44" y="70" font-weight="700" font-size="15" fill="#312e81">Browser (sender / recipient)</text>
  <text x="44" y="96" fill="#3730a3">SvelteKit UI, static</text>
  <rect x="44" y="114" width="210" height="92" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="58" y="138" font-weight="600" fill="#1e1b4b">WebCrypto</text>
  <text x="58" y="158" fill="#334155">AES-256-GCM, 1 MiB records</text>
  <text x="58" y="176" fill="#334155">key = 32 random bytes</text>
  <text x="58" y="194" fill="#334155">encrypted name / type / size</text>
  <rect x="44" y="222" width="210" height="74" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="58" y="246" font-weight="600" fill="#1e1b4b">Links</text>
  <text x="58" y="266" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#334155">/d#&lt;token&gt;.&lt;key&gt;</text>
  <text x="58" y="284" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#334155">/a#&lt;admin&gt;.&lt;key&gt;</text>
  <text x="44" y="324" fill="#4338ca" font-size="12">The # fragment never leaves the browser:</text>
  <text x="44" y="342" fill="#4338ca" font-size="12">no server or log sees tokens or the key.</text>
  <text x="44" y="372" fill="#4338ca" font-size="12">Tokens go only in POST bodies.</text>

  <!-- LB + service -->
  <rect x="352" y="40" width="250" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="372" y="70" font-weight="700" font-size="15" fill="#0f172a">Google Cloud</text>
  <rect x="372" y="86" width="210" height="44" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="386" y="113" fill="#0f172a">External HTTPS LB + Cloud Armor</text>
  <rect x="372" y="146" width="210" height="128" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="386" y="170" font-weight="600" fill="#0f172a">Cloud Run: file-vault</text>
  <text x="386" y="190" fill="#475569">one Go binary</text>
  <text x="386" y="210" fill="#475569">• embedded UI</text>
  <text x="386" y="228" fill="#475569">• JSON API, HMAC'd tokens</text>
  <text x="386" y="246" fill="#475569">• opens upload sessions,</text>
  <text x="386" y="262" fill="#475569">   signs 60 s download URLs</text>
  <line x1="477" y1="130" x2="477" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- data stores -->
  <rect x="680" y="60" width="256" height="104" rx="14" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="700" y="88" font-weight="700" fill="#14532d">Firestore</text>
  <text x="700" y="110" fill="#166534">shares (encrypted meta, size)</text>
  <text x="700" y="128" fill="#166534">token hashes, uses left</text>
  <text x="700" y="146" fill="#166534">audit events, TTL 30 days</text>

  <rect x="680" y="250" width="256" height="104" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="700" y="278" font-weight="700" fill="#78350f">Cloud Storage (CMEK)</text>
  <text x="700" y="300" fill="#92400e">ciphertext only: "FVE1" + records</text>
  <text x="700" y="318" fill="#92400e">deleted after 7 days</text>
  <text x="700" y="336" fill="#92400e">CORS: GET, PUT from the UI origin</text>

  <!-- arrows -->
  <line x1="274" y1="108" x2="371" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="284" y="98" fill="#475569" font-size="12">UI + API</text>

  <line x1="582" y1="190" x2="679" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="582" y1="240" x2="679" y2="290" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="590" y="322" fill="#475569" font-size="12">start session,</text>
  <text x="590" y="338" fill="#475569" font-size="12">stat, delete</text>

  <path d="M274 400 H808 V355" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
  <text x="300" y="392" fill="#4338ca" font-weight="600" font-size="12">ciphertext, browser ⇄ bucket directly</text>
  <text x="300" y="420" fill="#4338ca" font-size="12">resumable PUT (8 MiB chunks) · signed GET, then decrypt in the browser</text>
</svg>
