<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c5221f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">file-vault — Recipient request flow</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#5f6368">GET shows a confirmation page (no burn); POST /confirm performs the atomic burn. Defeats link-unfurl preflight.</text>

  <!-- Lifelines -->
  <g font-size="12" font-weight="600" fill="#202124">
    <rect x="50"  y="80" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="120" y="103" text-anchor="middle">Recipient</text>

    <rect x="240" y="80" width="140" height="36" rx="6" fill="#fff"     stroke="#202124"/>
    <text x="310" y="103" text-anchor="middle">LB + CDN</text>

    <rect x="430" y="80" width="140" height="36" rx="6" fill="#fff"     stroke="#137333"/>
    <text x="500" y="103" text-anchor="middle">API (Cloud Run)</text>

    <rect x="620" y="80" width="140" height="36" rx="6" fill="#fce8e6" stroke="#c5221f"/>
    <text x="690" y="103" text-anchor="middle">Firestore</text>

    <rect x="810" y="80" width="140" height="36" rx="6" fill="#fce8e6" stroke="#c5221f"/>
    <text x="880" y="103" text-anchor="middle">GCS</text>
  </g>

  <!-- Lifelines vertical -->
  <line x1="120" y1="120" x2="120" y2="640" stroke="#dadce0" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="310" y1="120" x2="310" y2="640" stroke="#dadce0" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="500" y1="120" x2="500" y2="640" stroke="#dadce0" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="690" y1="120" x2="690" y2="640" stroke="#dadce0" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="880" y1="120" x2="880" y2="640" stroke="#dadce0" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Step 1: GET /d/{token} -->
  <line x1="120" y1="150" x2="305" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="142" text-anchor="middle" font-size="11" fill="#202124">GET /d/{token}</text>

  <!-- Step 2: LB → API NEG -->
  <line x1="310" y1="180" x2="495" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="172" text-anchor="middle" font-size="11" fill="#202124">forward via NEG (no IAM auth added)</text>

  <!-- Step 3: HMAC token -->
  <g>
    <rect x="430" y="200" width="140" height="36" rx="4" fill="#e6f4ea" stroke="#137333"/>
    <text x="500" y="223" text-anchor="middle" font-size="11" fill="#202124">tokenHash = HMAC(pepper, t)</text>
  </g>

  <!-- Step 4: txn get + update -->
  <line x1="500" y1="260" x2="685" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="593" y="252" text-anchor="middle" font-size="11" fill="#202124">RunTransaction</text>

  <g>
    <rect x="620" y="275" width="190" height="80" rx="4" fill="#fce8e6" stroke="#c5221f"/>
    <text x="715" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#202124">atomic burn</text>
    <text x="715" y="310" text-anchor="middle" font-size="10" fill="#5f6368">tx.Get(download_tokens/{h})</text>
    <text x="715" y="325" text-anchor="middle" font-size="10" fill="#5f6368">if consumed_at != nil → fail</text>
    <text x="715" y="340" text-anchor="middle" font-size="10" fill="#5f6368">if now &gt; expires_at → fail</text>
    <text x="715" y="350" text-anchor="middle" font-size="10" fill="#5f6368">tx.Update(consumed_at = now)</text>
  </g>

  <!-- Step 5: commit OK -->
  <line x1="685" y1="380" x2="500" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="593" y="372" text-anchor="middle" font-size="11" fill="#202124">commit OK + share row</text>

  <!-- Failure branch -->
  <line x1="685" y1="410" x2="500" y2="410" stroke="#c5221f" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 3"/>
  <text x="593" y="402" text-anchor="middle" font-size="10" fill="#c5221f">alt: txn fails → log token_reuse_rejected → 404</text>

  <!-- Step 6: SignBlob mint URL -->
  <g>
    <rect x="430" y="430" width="140" height="50" rx="4" fill="#e6f4ea" stroke="#137333"/>
    <text x="500" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="#202124">IAM SignBlob</text>
    <text x="500" y="468" text-anchor="middle" font-size="10" fill="#5f6368">V4 signed URL · 60s</text>
  </g>

  <!-- Step 7: 302 to recipient -->
  <line x1="495" y1="510" x2="125" y2="510" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="502" text-anchor="middle" font-size="11" fill="#202124">302 Location: https://storage.googleapis.com/...?X-Goog-Signature=...</text>
  <text x="310" y="524" text-anchor="middle" font-size="10" fill="#5f6368">Cache-Control: no-store, private</text>

  <!-- Step 8: GET object -->
  <line x1="120" y1="555" x2="875" y2="555" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="547" text-anchor="middle" font-size="11" fill="#202124">browser follows redirect — GET signed URL</text>

  <!-- Step 9: file bytes -->
  <line x1="875" y1="590" x2="125" y2="590" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="582" text-anchor="middle" font-size="11" fill="#202124">file bytes</text>

  <!-- Notes -->
  <g transform="translate(50, 620)">
    <text x="0" y="0" font-size="10" font-style="italic" fill="#5f6368">• Steps 3–6 happen server-side in &lt;100ms typical. The signed URL is never seen until the burn commits.</text>
    <text x="0" y="14" font-size="10" font-style="italic" fill="#5f6368">• A second click on the same token races into the transaction, finds consumed_at set, and returns 404.</text>
  </g>
</svg>
