<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
<title>Load balancer request path</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4f46e5"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<rect x="24" y="40" width="160" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="38" y="67.5" font-size="13.5" fill="#0f172a" font-weight="600">DNS</text>
<text x="38" y="87.5" font-size="12.5" fill="#475569">A record → LB IP</text>
<rect x="24" y="176" width="160" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="38" y="203.5" font-size="13.5" fill="#312e81" font-weight="600">Browser</text>
<text x="38" y="223.5" font-size="12.5" fill="#4338ca">https://&lt;domain&gt;</text>
<path d="M104 175 L104 117" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="112" y="152" font-size="12" fill="#475569" text-anchor="start">Resolve</text>
<rect x="220" y="24" width="520" height="330" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="52" font-size="15" fill="#0f172a" font-weight="700">Your load balancer</text>
<text x="238" y="71" font-size="12.5" fill="#475569">Created by you, outside file-vault</text>
<rect x="240" y="84" width="150" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="254" y="111.5" font-size="13.5" fill="#0f172a" font-weight="600">Forwarding rule</text>
<text x="254" y="131.5" font-size="12.5" fill="#475569">Static IP, :443</text>
<rect x="410" y="84" width="150" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="424" y="111.5" font-size="13.5" fill="#0f172a" font-weight="600">HTTPS proxy</text>
<text x="424" y="131.5" font-size="12.5" fill="#475569">Managed cert</text>
<rect x="580" y="84" width="140" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="594" y="111.5" font-size="13.5" fill="#0f172a" font-weight="600">URL map</text>
<text x="594" y="131.5" font-size="12.5" fill="#475569">Host rule</text>
<path d="M390 120 L409 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M560 120 L579 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M184 214 L212 214 L212 120 L239 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="196" width="300" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="254" y="223.5" font-size="13.5" fill="#0f172a" font-weight="600">Backend service</text>
<text x="254" y="243.5" font-size="12.5" fill="#475569">Logging on, Cloud Armor policy</text>
<path d="M650 156 L650 180 L390 180 L390 195" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="258" y="300" font-size="12" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">X-Forwarded-For: &lt;client-ip&gt;, &lt;lb-ip&gt;</text>
<text x="258" y="320" font-size="12" fill="#475569">The service trusts the second entry from the right.</text>
<rect x="770" y="24" width="206" height="330" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="788" y="52" font-size="15" fill="#312e81" font-weight="700">file-vault</text>
<text x="788" y="71" font-size="12.5" fill="#4338ca">Created by its Terraform</text>
<rect x="788" y="196" width="170" height="72" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="802" y="223.5" font-size="13.5" fill="#1e1b4b" font-weight="600">Serverless NEG</text>
<text x="802" y="243.5" font-size="12.5" fill="#334155">file-vault-&lt;env&gt;</text>
<rect x="788" y="84" width="170" height="72" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="802" y="111.5" font-size="13.5" fill="#1e1b4b" font-weight="600">Cloud Run</text>
<text x="802" y="131.5" font-size="12.5" fill="#334155">Ingress: LB only</text>
<path d="M540 232 L787 232" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M873 196 L873 157" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="400" font-size="12.5" fill="#475569" text-anchor="middle">Other hosts on the same load balancer keep their own host rules and backends.</text>
<text x="500" y="422" font-size="12.5" fill="#475569" text-anchor="middle">Create the DNS record before the certificate: it validates only once the name resolves to the LB.</text>
</svg>
